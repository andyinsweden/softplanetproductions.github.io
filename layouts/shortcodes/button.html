{{ $href := .Get "href" | default "#" }}
{{ $target := .Get "target" | default "_self" }}
{{ $orange := eq (.Get "color") "orange" }}
<a href="{{ $href }}" target="{{ $target }}" rel="noopener noreferrer{{ if .Get "sponsored" }} sponsored{{ end }}" class="{{ if $orange }}score-purchase-button{{ else }}inline-flex items-center gap-2 rounded-md bg-sky-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2{{ end }}">
  {{ .Inner | markdownify }}
</a>
