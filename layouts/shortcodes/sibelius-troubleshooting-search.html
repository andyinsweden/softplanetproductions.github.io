<div class="sibelius-search" data-sibelius-search hidden>
  <div class="sibelius-search__field">
    <label for="sibelius-search-query">Search questions and answers</label>
    <input
      id="sibelius-search-query"
      type="search"
      autocomplete="off"
      aria-controls="sibelius-troubleshooting-results"
    />
  </div>
  <div class="sibelius-search__field">
    <label for="sibelius-search-category">Filter by category</label>
    <select
      id="sibelius-search-category"
      aria-controls="sibelius-troubleshooting-results"
    >
      <option value="">All categories</option>
      <option value="sound-and-playback">Sound and Playback</option>
      <option value="midi-and-note-input">MIDI and Note Input</option>
      <option value="notation-voices-and-rhythm">Notation, Voices and Rhythm</option>
      <option value="score-layout-and-spacing">Score Layout and Spacing</option>
      <option value="parts-printing-and-exporting">Parts, Printing and Exporting</option>
      <option value="saving-recovery-and-performance">Saving, Recovery and Performance</option>
    </select>
  </div>
  <p class="sibelius-search__status" role="status" aria-live="polite" aria-atomic="true"></p>
</div>
