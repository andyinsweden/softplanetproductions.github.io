name: Validate Hugo pull requests
on:
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "config/**"
      - "assets/**"
      - "static/**"
      - "hugo.toml"
      - ".github/workflows/*.yaml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.170.1"
      HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          printf '%s  %s\n' "${HUGO_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -C /usr/local/bin -xzf "${RUNNER_TEMP}/${archive}" hugo
          hugo version
      - name: Build (no deployment)
        run: hugo build --gc --minify --baseURL "https://softplanetproductions.com/"
