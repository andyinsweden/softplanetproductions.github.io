name: Validate Hugo pull requests
on:
  pull_request:
    paths:
      - "content/**"
      - "layouts/**"
      - "config/**"
      - "assets/**"
      - "hugo.toml"
      - ".github/workflows/validate-hugo-pr.yaml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.165.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Hugo Extended
        run: |
          curl -sfL -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_extended_0.165.0_linux-amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/hugo.tar.gz hugo
          hugo version
      - name: Build (no deployment)
        run: hugo build --gc --minify --baseURL "https://softplanetproductions.com/"
